<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - UiTM Smart Campus Hostel Hub</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100 p-3">

  <button id="themeToggle" class="btn btn-theme-toggle" type="button" aria-label="Switch to dark mode" title="Switch to dark mode">
    <i class="bi bi-moon-stars-fill" id="themeIcon" aria-hidden="true"></i>
  </button>

  <div class="card auth-card p-4 shadow-lg">
    
    <!-- Portal Header -->
    <div class="text-center mb-4">
      <h3 class="fw-bold brand-title mb-1">UiTM HOSTEL HUB</h3>
      <p class="small brand-subtitle mb-0">STUDENT KOLEJ PORTAL</p>
    </div>

    <!-- Error Alert Box -->
    <div id="authAlert" class="alert alert-danger d-none py-2 text-center small fw-semibold" role="alert"></div>

    <!-- LOGIN FORM -->
    <form id="loginForm">
      <div class="mb-3">
        <label for="loginEmail" class="form-label small fw-semibold">ID / Email</label>
        <input type="text" class="form-control" id="loginEmail"  placeholder="e.g. 2025176851 or email" required>
      </div>
      <div class="mb-3">
        <label for="loginPassword" class="form-label small fw-semibold">Password</label>
        <input type="password" class="form-control" id="loginPassword" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn btn-purple w-100 fw-bold py-2 mb-3">Sign In</button>
      <p class="text-center small mb-0">
        Don't have an account? <a href="#" id="showSignUp" class="text-decoration-none fw-bold text-custom-purple">Sign Up</a>
      </p>
    </form>

    <!-- SIGN UP FORM (HIDDEN) -->
    <form id="signupForm" class="d-none">
      <div class="mb-2">
        <label for="signupName" class="form-label small fw-semibold">Name</label>
        <input type="text" class="form-control" id="signupName" placeholder="Safiyyah" required>
      </div>
      <div class="mb-2">
        <label for="signupStudentId" class="form-label small fw-semibold">ID Number</label>
        <input type="text" class="form-control" id="signupStudentId" placeholder="e.g. 2021234567" required>
      </div>
      <div class="mb-2">
        <label for="signupEmail" class="form-label small fw-semibold">UiTM Email</label>
        <input type="email" class="form-control" id="signupEmail" placeholder="••••••••@student.uitm.edu.my" required>
      </div>
      <div class="mb-3">
        <label for="signupPassword" class="form-label small fw-semibold">Password</label>
        <input type="password" class="form-control" id="signupPassword" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn btn-purple w-100 fw-bold py-2 mb-3">Create Account</button>
      <p class="text-center small mb-0">
        Already registered? <a href="#" id="showLogin" class="text-decoration-none fw-bold text-custom-purple">Sign In</a>
      </p>
    </form>

    
    
  </div>

  <script src="js/script.js"></script>
</body>
</html>
